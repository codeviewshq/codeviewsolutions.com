name: Check and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser system libraries
        run: sudo apt-get install -y libnspr4 libnss3 libasound2t64
      - run: npm run build
      - run: npm run check:contrast
      - run: npm run check:layout

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # GitHub Pages serves this repo from a subdirectory, so the build
          # needs to know both the origin and the base path. Everywhere else
          # (Vercel, Netlify, the custom domain) uses the defaults in
          # astro.config.mjs and serves from the root.
          #
          # WHEN YOU POINT codeviewsolutions.com AT PAGES: delete this whole
          # `env:` block and add a CNAME file — see README.md.
          SITE_URL: https://codeviewshq.github.io
          SITE_BASE: /codeviewsolutions.com

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
