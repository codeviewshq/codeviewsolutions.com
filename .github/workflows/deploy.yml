# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Before this works, go to your repository's
#   Settings -> Pages -> Build and deployment -> Source
# and choose "GitHub Actions".
#
# If you are NOT using a custom domain, also read the "GitHub Pages" section
# of README.md — you need to set `base` in astro.config.mjs.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          node-version: 20
        env:
          # GitHub Pages serves this repo from a subdirectory, so the build
          # needs to know both the origin and the base path. Everywhere else
          # (Vercel, Netlify, the custom domain) uses the defaults in
          # astro.config.mjs and serves from the root.
          #
          # WHEN YOU POINT codeviewsolutions.com AT PAGES: delete this whole
          # `env:` block and add a CNAME file — see README.md.
          SITE_URL: https://codeviewshq.github.io
          SITE_BASE: /codeviewsolutions.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
